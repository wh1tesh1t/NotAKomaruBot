send_help: |
  <b>Command:</b> <code>!send</code>
  Send messages with button support.

  <b>Arguments:</b>
  ››› <code>-t</code> — text
  ››› <code>-id</code> — chat ID
  ››› <code>-tid</code> — forum topic ID
  ››› <code>-rply</code> — reply to a message by ID
  ››› <code>-url(Number)</code> — add a URL button
  ››› <code>-cb(Number)</code> — add a callback button
  ››› <code>-edit</code> — edit a message
  ››› <code>-del</code> — delete a message
  ››› <code>-fwd</code> — forward a message
  ››› <code>-h</code> — show help message
  ››› <code>|</code> — separator for url/cb buttons (new row)

  <b>Examples:</b>
  <code>!send -t Hello\nWorld</code> <b>Simple message</b>
  <code>!send -id -1001234567890 -tid 55 -t Hello!</code> <b>Message in topic</b>
  <code>!send -t Website link -url1 https://github.com GitHub Link</code> <b>Message with URL button</b>
  <code>!send -t Text with Callback button -cb1 start_pvt Start Private</code> <b>Message with Callback button</b>
  <code>!send -rply 10 -t Reply</code> <b>Reply by MessageID</b>
  <code>!send -id -12345678901 -del 50</code> <b>Delete message by MessageID</b>
